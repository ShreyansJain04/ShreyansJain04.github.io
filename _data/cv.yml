- title: Research Experience
  type: time_table
  contents:
  - title: Research Intern
    institution: 'Purdue University, USA (Advisors: Prof. Dharmendra Saraswat, Prof. Vaneet Aggarwal)'
    year: May '25 – Jul '25
    description:
    - Designed and implemented GeoTutor, an intelligent tutoring system for personalized GIS education, integrating a hybrid Retrieval-Augmented Generation (RAG) pipeline (BM25 + dense retrieval + cross-encoder reranking) grounded in Large Language Models (LLMs) and prompt engineering for accurate, context-aware responses.
    - Built an adaptive pedagogical engine with a learner memory model to generate personalized learning plans, detect conceptual errors, and schedule reviews using the SuperMemo-2 spaced repetition algorithm.
  - title: Research Intern
    institution: 'Indian Institute of Science (IISc), Bangalore (Advisor: Prof. Prathosh A.P.)'
    year: May '24 – Nov '24
    description:
    - Engineered a novel unlearning framework (VDU) for diffusion models (DDPM, Stable Diffusion) by formulating it as a variational inference problem, approximating the retrained posterior using only the images to forget.
    - Achieved a 71.6% unlearning rate (PUL) on CIFAR-10 while improving sample quality (u-FID) by over 10x compared to baseline methods, using a novel stability regularizer to prevent catastrophic forgetting. Published in TMLR 2026.
  - title: Undergraduate Researcher, MUSE Lab
    institution: 'IIT Gandhinagar (Advisor: Prof. Himanshu Shekhar, with Prof. Kenneth Bader, UChicago)'
    year: Dec '23 – 2026
    description:
    - 'Real-time streak-artifact suppression for therapy-guidance ultrasound: two-stage U-Net + Fourier-attention U-Net running at >440 FPS with a +13.7 dB reconstruction gain; led to a published patent.'
    - Histotripsy bubble-cloud segmentation (EfficientNet U-Net, Dice-Focal loss, mean IoU 0.838) and low-frame-rate microvascular imaging.
  - title: Undergraduate Researcher
    institution: 'IIT Gandhinagar (Advisor: Prof. Shanmuganathan Raman)'
    year: Feb '24 – Nov '24
    description:
    - 'WavShadow: wavelet-based shadow segmentation and removal; state-of-the-art 1.38 BER on ISTD and 36.7 PSNR on DESOBA. Published at ICVGIP 2024.'
